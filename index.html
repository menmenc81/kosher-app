<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>כושר ב־15 דקות</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2b303b;
  --tx:#f1f3f7;--mut:#8d95a5;--acc:#c6f432;--acc2:#ff8a3d;--ok:#3ddc97;--bad:#ff5d6c;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Rubik,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:6px 0 2px;font-weight:800}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
.mut{color:var(--mut)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.big{display:block;width:100%;padding:16px;border-radius:14px;font-size:18px;font-weight:700;text-align:right}
.big.prim{background:var(--acc);color:#111}
.big.sec{background:var(--card2);border:1px solid var(--line)}
.big small{display:block;font-weight:400;font-size:13px;opacity:.75;margin-top:2px}
.btn{padding:10px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:500}
.btn.acc{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--mut)}
.exlist{list-style:none;padding:0;margin:8px 0 14px}
.exlist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exlist li:last-child{border:0}
.exlist .fig{width:64px;height:42px;flex:none;background:var(--card2);border-radius:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{text-align:center;padding:8px 0;border-radius:12px;background:var(--card2);font-size:12px;color:var(--mut);border:1px solid transparent}
.day.plan{border-color:var(--line)}
.day.today{border-color:var(--acc);color:var(--tx)}
.day .m{font-size:17px;height:22px;line-height:22px}
.day.done{background:rgba(198,244,50,.14);color:var(--acc)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:var(--ok);border-color:var(--ok)}
.sw.on:after{right:23px;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:170px;padding:12px 0 14px;color:var(--mut);font-size:13px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc)}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--card2);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
/* workout */
#wo{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wo.show{display:flex}
.wtop{display:flex;align-items:center;gap:10px;padding:12px 16px}
.prog{flex:1;height:6px;background:var(--card2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.wbody{flex:1;overflow:auto;padding:0 16px 16px;max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column}
.stage{background:var(--card);border-radius:22px;border:1px solid var(--line);aspect-ratio:220/140;width:100%;display:block}
.wname{font-size:26px;font-weight:800;margin:14px 0 2px}
.wlvl{color:var(--mut);margin-bottom:8px}
.target{font-size:15px;color:var(--acc);font-weight:500}
.cue{background:var(--card);border-radius:14px;padding:12px 14px;margin:12px 0;color:#cfd5df;font-size:15px;line-height:1.5}
.vid{color:var(--acc2);text-decoration:none;font-size:14px}
.counter{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0}
.counter button{width:62px;height:62px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:30px}
.counter .n{font-size:64px;font-weight:800;min-width:110px;text-align:center}
.clock{font-size:76px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.clock.rest{color:var(--acc2)}
.wact{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:10px}
.restbox{text-align:center;margin-top:10px}
.restbox .next{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin:14px 0;text-align:right}
.restbox .next svg{width:96px;flex:none;background:var(--card2);border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.lvls{display:flex;gap:4px;margin-top:6px}
.lvls i{flex:1;height:6px;border-radius:9px;background:var(--card2)}
.lvls i.on{background:var(--acc)}
.lvls i.bar{outline:1px dashed var(--mut);outline-offset:-1px}
input[type=number],textarea{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px;font:inherit;width:100%}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.days button.on{background:var(--acc);color:#111;font-weight:700}
.hist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist{list-style:none;padding:0;margin:0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;display:none}
.lvup{background:rgba(198,244,50,.12);border:1px solid var(--acc);border-radius:14px;padding:12px;margin:8px 0}
.sync{font-size:12px;color:var(--mut)}
/* fun */
.hero{background:linear-gradient(135deg,#232a12 0%,#181b22 60%);border-color:#3b4a14}
.rankrow{display:flex;align-items:center;gap:12px}
.rankic{font-size:38px;width:56px;height:56px;border-radius:16px;background:rgba(198,244,50,.12);display:flex;align-items:center;justify-content:center;flex:none}
.xpbar{height:10px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#8ee000);border-radius:9px;transition:width .6s}
.walkbar{height:12px;background:var(--card2);border-radius:9px;overflow:hidden;margin:10px 0}
.walkbar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#c6f432);border-radius:9px;transition:width .4s}
.live{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok)}
.quick{display:flex;gap:8px;margin-top:10px}
.quick .btn{flex:1}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--card2);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;color:var(--mut);border:1px solid var(--line)}
.badge b{display:block;font-size:28px;line-height:36px;filter:grayscale(1);opacity:.35}
.badge.got{color:var(--tx);border-color:#4b5d16;background:rgba(198,244,50,.08)}
.badge.got b{filter:none;opacity:1}
.ring{position:relative;width:min(56vw,210px);aspect-ratio:1;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--card2)}
.ring .fg{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:326.7;transition:stroke-dashoffset .15s linear,stroke .3s}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rs{font-size:min(17vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring .rl{color:var(--mut);font-size:14px;margin-top:4px}
.ring.ready .fg{stroke:var(--acc2)}.ring.ready .rs{color:var(--acc2)}
.ring.rest .fg{stroke:var(--acc2)}
.ring.paused{opacity:.55}
.hbtns{display:flex;gap:10px}
.hbtns .big{flex:1;text-align:center}
details.cue summary{cursor:pointer;color:var(--acc);font-weight:500;list-style:none}
details.cue summary::-webkit-details-marker{display:none}
.motiv{font-size:17px;margin:4px 0 0;color:#e6ebf2}
.flash{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.6);font-size:44px;font-weight:800;color:var(--acc);opacity:0;pointer-events:none;z-index:45;transition:all .35s;text-shadow:0 4px 30px rgba(0,0,0,.6);white-space:nowrap}
.flash.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.xpgain{font-size:44px;font-weight:800;color:var(--acc)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin:8px 0 4px}
.chips button{padding:12px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:700}
.chips button.in{border-color:#4b5d16;color:var(--acc)}
.chips button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.how{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 0}
.how span{background:var(--card);border-radius:99px;padding:5px 10px;font-size:12px;color:#cfd5df}
.slide{text-align:center;padding:6px 4px}
.slide .ic{font-size:64px;line-height:1.2}
.slide p{color:#cfd5df;font-size:16px;line-height:1.55;margin:8px 0 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--card2)}
.dots i.on{background:var(--acc);width:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav">
  <button data-v="home" class="on"><b>🏠</b>היום</button>
  <button data-v="progress"><b>📈</b>התקדמות</button>
  <button data-v="settings"><b>⚙️</b>הגדרות</button>
</nav>
<div id="wo"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>
<canvas id="confetti"></canvas>

<script>
"use strict";
/* ================= FIGURE ENGINE ================= */
const FL=128;
const D=a=>{const r=a*Math.PI/180;return[Math.sin(r),-Math.cos(r)]};
const add=(p,v,l)=>[p[0]+v[0]*l,p[1]+v[1]*l];
const ang=(a,b)=>Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;
function ik(A,B,l1,l2,bend){
  let dx=B[0]-A[0],dy=B[1]-A[1],h0=Math.hypot(dx,dy)||1;
  const ux=dx/h0,uy=dy/h0;
  const d=Math.min(Math.max(h0,Math.abs(l1-l2)+.5),l1+l2-.05);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const mid=[A[0]+ux*a+bend*h*(-uy),A[1]+uy*a+bend*h*ux];
  return[mid,[A[0]+ux*d,A[1]+uy*d]];
}
function limb(root,s,l1,l2){
  if(s.to)return ik(root,s.to,l1,l2,s.bend||1);
  const m=add(root,D(s.a[0]),l1);return[m,add(m,D(s.a[1]),l2)];
}
function P(o){
  const hp=o.hip||[0,0];
  const s=o.sh||add(hp,D(o.t),40);
  const ta=ang(hp,s);
  const h=add(s,D(o.n!=null?o.n:ta),13);
  const[k1,f1]=limb(hp,o.legs[0],27,27),[k2,f2]=limb(hp,o.legs[1],27,27);
  const[e1,w1]=limb(s,o.arms[0],20,20),[e2,w2]=limb(s,o.arms[1],20,20);
  let p={h,s,hp,k1,f1,k2,f2,e1,w1,e2,w2};
  if(o.anchor){const[j,x,y]=o.anchor,dx=x-p[j][0],dy=y-p[j][1];for(const k in p)p[k]=[p[k][0]+dx,p[k][1]+dy];}
  return p;
}
function withLeg(p,i,to,bend){const q={...p};const[k,f]=ik(p.hp,to,27,27,bend);q['k'+i]=k;q['f'+i]=f;return q}
const straight=a=>({a:[a,a]});
const stand=(x=110,arms)=>P({hip:[x,74],t:0,legs:[{a:[180,180]},{a:[178,182]}],arms:arms||[{a:[188,182]},{a:[172,178]}]});
function pushPoses(h){
  const hy=FL-h,hx=132;
  const tt=90-Math.asin((h+40)/92)*180/Math.PI, tb=90-Math.asin((h+12)/92)*180/Math.PI;
  const top=P({t:tt,legs:[straight(tt+180),straight(tt+180)],arms:[straight(180),straight(180)],anchor:['w1',hx,hy]});
  const bot=P({t:tb,legs:[straight(tb+180),straight(tb+180)],arms:[{a:[293.6,180]},{a:[293.6,180]}],anchor:['w1',hx,hy]});
  return{top,bot};
}
const box=(x1,y1,x2,y2)=>`<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" rx="2" class="prop"/>`;
const ANIM={};
(function build(){
  // push-ups
  [[45,'push45'],[25,'push25'],[0,'push0']].forEach(([h,k])=>{
    const{top,bot}=pushPoses(h);
    ANIM[k]={props:h?box(116,FL-h,156,FL):'',frames:[{p:top,hold:350,d:900},{p:bot,hold:120,d:700}]};
  });
  {const{top,bot}=pushPoses(0);ANIM.push0slow={props:'',frames:[{p:top,hold:300,d:2600},{p:bot,hold:200,d:800}]};}
  // squats
  const sqTop=P({hip:[110,74],t:0,legs:[straight(180),straight(180)],arms:[{a:[95,90]},{a:[95,90]}]});
  const sqBot=P({hip:[90,98],t:42,legs:[{to:[110,FL],bend:-1},{to:[110,FL],bend:-1}],arms:[{a:[82,85]},{a:[82,85]}]});
  const air=P({hip:[110,58],t:0,legs:[{a:[180,176]},{a:[182,178]}],arms:[{a:[8,2]},{a:[8,2]}]});
  const chair=box(60,101,98,105)+box(60,70,64,128)+box(93,105,97,128);
  ANIM.chairsquat={props:chair,frames:[{p:sqTop,hold:300,d:1000},{p:sqBot,hold:250,d:800}]};
  ANIM.squat={props:'',frames:[{p:sqTop,hold:250,d:900},{p:sqBot,hold:100,d:700}]};
  ANIM.pausesquat={props:'',frames:[{p:sqTop,hold:250,d:900},{p:sqBot,hold:1400,d:700}]};
  ANIM.jumpsquat={props:'',frames:[{p:sqTop,hold:200,d:700},{p:sqBot,hold:80,d:260},{p:air,hold:60,d:300}]};
  // lunges
  const lTop=P({hip:[122,74],t:0,legs:[straight(180),{a:[178,182]}],arms:[{a:[188,182]},{a:[172,178]}]});
  const lBot=P({hip:[100,97],t:0,legs:[{to:[122,FL],bend:-1},{to:[64,FL-2],bend:-1}],arms:[{a:[188,182]},{a:[172,178]}]});
  ANIM.lunge={props:'',frames:[{p:lTop,hold:300,d:900},{p:lBot,hold:150,d:800}]};
  const bTop=P({hip:[104,77],t:0,legs:[{to:[122,FL],bend:-1},{to:[60,104],bend:-1}],arms:[{a:[188,182]},{a:[172,178]}]});
  const bBot=P({hip:[96,100],t:4,legs:[{to:[122,FL],bend:-1},{to:[60,104],bend:-1}],arms:[{a:[188,182]},{a:[172,178]}]});
  ANIM.bulgarian={props:box(38,105,74,109)+box(40,109,44,128)+box(68,109,72,128),frames:[{p:bTop,hold:300,d:1000},{p:bBot,hold:150,d:800}]};
  // rows under table
  const G=[70,64],table=box(0,55,76,62)+box(6,62,12,128);
  const rb=(feet,bend)=>P({hip:feet[0]>150?[108.7,114.3]:[109,112],sh:[70,104],legs:[{to:feet,bend},{to:feet,bend}],arms:[{to:G,bend:1},{to:G,bend:1}]});
  const rt=(feet,bend)=>P({hip:feet[0]>150?[114.3,100.6]:[114,101],sh:[80,80],legs:[{to:feet,bend},{to:feet,bend}],arms:[{to:G,bend:1},{to:G,bend:1}]});
  ANIM.rowbent={props:table,frames:[{p:rb([142,FL],-1),hold:300,d:900},{p:rt([142,FL],-1),hold:200,d:1000}]};
  ANIM.rowstraight={props:table,frames:[{p:rb([160,FL],-1),hold:300,d:900},{p:rt([160,FL],-1),hold:200,d:1000}]};
  ANIM.rowpause={props:table,frames:[{p:rb([160,FL],-1),hold:300,d:900},{p:rt([160,FL],-1),hold:2200,d:1000}]};
  // pull-up bar
  const PG=[108,14],door=box(56,4,60,128)+box(156,4,160,128)+`<line x1="56" y1="14" x2="160" y2="14" class="bar"/>`;
  const hang=P({hip:[108,94],sh:[108,54],legs:[{a:[175,260]},{a:[172,262]}],arms:[{to:PG,bend:1},{to:PG,bend:1}]});
  const chin=P({hip:[102,70],sh:[104,30],n:10,legs:[{a:[172,255]},{a:[170,257]}],arms:[{to:PG,bend:1},{to:PG,bend:1}]});
  ANIM.negative={props:door,frames:[{p:chin,hold:500,d:2800},{p:hang,hold:400,d:600}]};
  ANIM.pullup={props:door,frames:[{p:hang,hold:300,d:1000},{p:chin,hold:250,d:1200}]};
  // burpees
  const st=stand(110),stUp=stand(110,[{a:[10,4]},{a:[6,2]}]);
  const bsq=P({hip:[96,108],t:62,legs:[{to:[110,FL],bend:-1},{to:[110,FL],bend:-1}],arms:[{to:[136,FL],bend:1},{to:[136,FL],bend:1}]});
  const pl=pushPoses(0),plTop=P({t:64.2,legs:[straight(244.2),straight(244.2)],arms:[straight(180),straight(180)],anchor:['w1',136,FL]});
  const plBot=P({t:82.5,legs:[straight(262.5),straight(262.5)],arms:[{a:[293.6,180]},{a:[293.6,180]}],anchor:['w1',136,FL]});
  ANIM.burpee0={props:'',frames:[{p:st,hold:250,d:550},{p:bsq,hold:120,d:450},{p:plTop,hold:350,d:450},{p:bsq,hold:120,d:550},{p:stUp,hold:200,d:450}]};
  ANIM.burpee1={props:'',frames:[{p:st,hold:200,d:450},{p:bsq,hold:80,d:380},{p:plTop,hold:250,d:380},{p:bsq,hold:80,d:300},{p:air,hold:60,d:350}]};
  ANIM.burpee2={props:'',frames:[{p:st,hold:200,d:450},{p:bsq,hold:80,d:380},{p:plTop,hold:80,d:450},{p:plBot,hold:80,d:450},{p:plTop,hold:80,d:380},{p:bsq,hold:80,d:300},{p:air,hold:60,d:350}]};
  // mountain climbers
  const cb=P({t:64.2,legs:[straight(244.2),straight(244.2)],arms:[straight(180),straight(180)],anchor:['w1',150,FL]});
  const c1=withLeg(cb,1,[cb.hp[0]+18,FL-4],-1),c2=withLeg(cb,2,[cb.hp[0]+18,FL-4],-1);
  ANIM.climber={props:'',frames:[{p:c1,hold:40,d:230},{p:c2,hold:40,d:230}]};
  // plank (forearms)

const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function poseAt(an,ms){
  const fr=an.frames;let tot=0;for(const f of fr)tot+=f.hold+f.d;
  let t=ms%tot;
  for(let i=0;i<fr.length;i++){
    const f=fr[i];
    if(t<f.hold)return f.p;t-=f.hold;
    if(t<f.d){const n=fr[(i+1)%fr.length].p,k=ease(t/f.d),o={};for(const j in f.p)o[j]=lerp(f.p[j],n[j],k);return o}
    t-=f.d;
  }
  return fr[0].p;
}

function confetti(){
  const c=$('#confetti'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#c6f432','#ff8a3d','#3ddc97','#f1f3f7','#7cc6ff','#ff5d6c'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function fr(t){const e=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-e/3200);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(e<3200)requestAnimationFrame(fr);else x.clearRect(0,0,W,H)})(t0);
}
function celebrate(lines){if(!lines.length)return;confetti();sheet(`<div style="text-align:center;font-size:56px">🎉</div>${lines.map(l=>`<div class="lvup">${l}</div>`).join('')}<button class="big prim" style="text-align:center" onclick="closeSheet()">יאללה!</button>`)}
const badgeLine=b=>`<b>${b.ic} תג חדש: ${b.n}</b><div class="small mut">${b.d}</div>`;

function startWalk(){S.walkRun=Date.now();save();toast('🐕 טיימר הליכה הופעל — שיהיה כיף!');render()}
function stopWalk(){const m=Math.round((Date.now()-S.walkRun)/60000);S.walkRun=0;if(m<1){save();toast('ההליכה הייתה קצרה מדי לרישום');render();return}addWalk(m)}
function addWalk(m){
  const td=today(),goal=S.settings.walkGoal,before=S.walkMin[td]||0,after=Math.min(before+m,240);
  S.walkMin[td]=after;
  const addKm=m/60*S.settings.pace;S.walkKm[td]=Math.round(((S.walkKm[td]||0)+addKm)*100)/100;S.walkEst[td]=true;
  const keys=Object.keys(S.walkMin).sort();if(keys.length>400)keys.slice(0,keys.length-400).forEach(k=>{delete S.walkMin[k];delete S.walkKm[k];delete S.walkEst[k]});
  let xp=Math.min(after,60)-Math.min(before,60),lines=[];
  if(before<goal&&after>=goal){xp+=20;lines.push(`<b>🐕 יעד ההליכה הושג!</b><div class="small mut">${after} דקות היום · +${xp} XP</div>`)}
  const up=addXP(xp);if(up)lines.push(lvlLine());
  checkBadges().forEach(b=>lines.push(badgeLine(b)));
  save();render();
  if(lines.length)celebrate(lines);else toast(`🐾 +${m} דק׳ · ≈${kmFmt(addKm)} ק״מ · +${xp} XP`);
}
function editKm(){
  const td=today(),cur=S.walkKm[td]||0;

    <p class="small mut" style="margin:0">${S.walkEst[td]&&cur?`ההערכה לפי הזמן: ${kmFmt(cur)} ק״מ. `:''}פתח את Google Fit או Samsung Health, העתק את המרחק של היום והזן כאן.</p>
    <div class="row"><input type="number" step="0.01" min="0" inputmode="decimal" id="kmIn" value="${cur?kmFmt(cur):''}" placeholder="ק״מ"><span style="font-weight:700">ק״מ</span></div>
    <button class="big prim" id="kmSave" style="text-align:center">שמור מרחק מדויק</button><button class="btn" id="kmCl">ביטול</button>`);
  $('#kmCl').onclick=closeSheet;

}

/* ================= TIMER ================= */
let actx=null,wake=null,TM=null;
function beep(f=880,ms=160){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+ms/1000);o.start();o.stop(actx.currentTime+ms/1000)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function lockWake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
const ringHTML=(cls,label)=>`<div class="ring ${cls}" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52"/></svg><div class="rt"><b class="rs"></b><span class="rl">${label}</span></div></div>`;
function drawRing(frac,s){const r=$('#ring');if(!r)return;r.querySelector('.fg').style.strokeDashoffset=(326.7*(1-frac)).toFixed(1);r.querySelector('.rs').textContent=fmt(s)}
function runTimer(sec,onEnd,opt={}){
  clearT();TM={total:sec*1000,endAt:Date.now()+sec*1000,left:0,paused:false,ls:-1,onEnd,half:opt.half};
  TM.iv=setInterval(tickT,100);tickT();
}
function tickT(){
  if(!TM||TM.paused)return;
  const ms=Math.max(0,TM.endAt-Date.now()),s=Math.ceil(ms/1000);
  drawRing(ms/TM.total,s);
  if(s!==TM.ls){TM.ls=s;
    if(s<=3&&s>0)beep(660,90);
    if(TM.half&&TM.total>=20000&&s===Math.round(TM.total/2000)){beep(880,80);flash('חצי! 💪')}}
  if(ms<=0){const f=TM.onEnd;clearT();beep(1040,260);buzz([120,60,120]);f()}
}
function pauseT(){if(!TM)return false;if(TM.paused){TM.endAt=Date.now()+TM.left;TM.paused=false}else{TM.left=TM.endAt-Date.now();TM.paused=true}$('#ring')&&$('#ring').classList.toggle('paused',TM.paused);return TM.paused}
function addT(sec){if(!TM)return;if(TM.paused)TM.left+=sec*1000;else TM.endAt+=sec*1000;TM.total+=sec*1000;tickT()}
function clearT(){if(TM)clearInterval(TM.iv);TM=null}
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);

/* ================= WORKOUT ENGINE ================= */
function startWO(w,mode){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  lockWake();
  const rounds=mode==='full'?3:1,ids=WORKOUTS[w],steps=[];
  WARM[mode].forEach(x=>steps.push({k:'warm',...x}));
  steps.push({k:'rest',s:10,label:'מתחילים'});
  for(let r=0;r<rounds;r++)ids.forEach((id,i)=>{
    steps.push({k:'ex',id,r});
    const last=r===rounds-1&&i===ids.length-1;
    if(!last)steps.push({k:'rest',s:mode==='full'?(i===ids.length-1?40:20):15,label:i===ids.length-1?`סבב ${r+1} הושלם! 🎯`:''});
  });
  WO={w,mode,rounds,steps,i:0,res:{}};
  ids.forEach(id=>WO.res[id]=[]);
  $('#wo').classList.add('show');document.body.style.overflow='hidden';
  showStep();
}
function nextStep(){clearT();WO.i++;if(WO.i>=WO.steps.length)return finish();showStep()}
function stepNext(from){for(let j=from+1;j<WO.steps.length;j++){const s=WO.steps[j];if(s.k!=='rest')return s}return null}
function head(){
  const st=WO.steps[WO.i],pct=Math.round(WO.i/WO.steps.length*100);
  const exs=WO.steps.filter(x=>x.k==='ex'),k=WO.steps.slice(0,WO.i+1).filter(x=>x.k==='ex').length;
  const lab=WO.mode==='free'?'טיימר':st.k==='warm'?'חימום':st.k==='ex'?`תרגיל ${k}/${exs.length}`:'מנוחה';
  return `<div class="wtop"><button class="btn" id="xq">✕</button><div class="prog"><i style="width:${pct}%"></i></div><span class="small mut" style="min-width:64px;text-align:left">${lab}</span></div>`;
}
const vidLink=id=>`<div style="margin-top:8px"><a class="vid" href="${ytUrl(id)}" target="_blank" rel="noopener">▶ סרטון הדגמה ביוטיוב</a></div>`;
function showStep(){
  const st=WO.steps[WO.i],wo=$('#wo');
  if(st.k==='rest'){
    const n=stepNext(WO.i);
    const nm=n.k==='ex'?EX[n.id].name:n.name,an=n.k==='ex'?L(n.id).anim:n.anim,tg=n.k==='ex'?tgt(n.id):n.s+' שניות';
    wo.innerHTML=head()+`<div class="wbody"><div class="restbox">
      <div style="font-weight:700;font-size:18px">${st.label||'מנוחה'}</div>
      ${ringHTML('rest','מנוחה')}
      <p class="motiv">${pick(RESTL)}</p>
      <div class="next">${figSVG(an)}<div><div class="small mut">הבא בתור</div><b style="font-size:18px">${nm}</b><div class="small" style="color:var(--acc)">${tg}</div></div></div></div>
      <div class="wact"><div class="hbtns"><button class="big sec" id="plus">+10 שנ׳</button><button class="big prim" id="skip">דלג ←</button></div></div></div>`;
    runTimer(st.s,nextStep);
    $('#plus').onclick=()=>addT(10);$('#skip').onclick=nextStep;
  }else if(st.k==='warm'||(st.k==='ex'&&EX[st.id].type==='time')){
    const isEx=st.k==='ex',lvl=isEx?L(st.id):st,nm=isEx?EX[st.id].name:st.name,sec=isEx?lvl.s:st.s;
    wo.innerHTML=head()+`<div class="wbody">${figSVG(lvl.anim,'stage')}

      <div id="rwrap">${ringHTML('ready','התכונן…')}</div>
      ${S.sessions.length<3&&WO.mode!=='free'?'<div class="how"><span>⏱ הטיימר מתחיל לבד — פשוט תחזיק עד הצפצוף</span></div>':''}
      <details class="cue"><summary>💡 איך עושים נכון?</summary><div style="margin-top:8px">${lvl.cue}</div>${isEx?vidLink(st.id):''}</details>
      <div class="wact"><div class="hbtns"><button class="big sec" id="pz">⏸ השהה</button><button class="big sec" id="early">${isEx?'עצרתי לפני הזמן':WO.mode==='free'?'עצור':'דלג'}</button></div></div></div>`;
    const go=()=>{
      $('#rwrap').innerHTML=ringHTML('',isEx?'עבוד! 💪':'קדימה');beep(1175,180);flash('צא! 🔥');
      runTimer(sec,()=>{if(isEx){WO.res[st.id].push(1);flash(pick(CHEER))}nextStep()},{half:1});
    };
    runTimer(3,go);
    $('#pz').onclick=()=>{const p=pauseT();$('#pz').textContent=p?'▶ המשך':'⏸ השהה'};
    $('#early').onclick=()=>{clearT();if(WO.mode==='free'){endWO();return}if(isEx)WO.res[st.id].push(0);nextStep()};
  }else{
    const e=EX[st.id],lvl=L(st.id);
    const prev=WO.res[st.id];let n=prev.length?prev[prev.length-1]:lvl.r[1];
    const vals=[];for(let v=Math.max(0,lvl.r[0]-3);v<=lvl.r[1]+3;v++)vals.push(v);if(!vals.includes(n))vals.push(n),vals.sort((a,b)=>a-b);
    wo.innerHTML=head()+`<div class="wbody">${figSVG(lvl.anim,'stage')}
      <div class="wname">${e.name}</div><div class="wlvl">${lvl.n}</div>
      <div class="target">🎯 ${tgt(st.id)}</div>
      <details class="cue"><summary>💡 איך עושים נכון?</summary><div style="margin-top:8px">${lvl.cue}</div>${vidLink(st.id)}</details>
      ${S.sessions.length<3?'<div class="how"><span>① בצע כמו בדמות</span><span>② סמן כמה הצלחת</span><span>③ לחץ סיימתי</span></div>':''}
      <div class="wact"><div class="small mut" style="text-align:center">כמה חזרות הצלחת${e.side?' לכל צד':''}? <span style="color:var(--acc)">ירוק = בטווח היעד</span></div>
      <div class="chips">${vals.map(v=>`<button data-n="${v}" class="${v>=lvl.r[0]&&v<=lvl.r[1]?'in':''} ${v===n?'on':''}">${v}</button>`).join('')}</div>
      <button class="big prim" id="ok" style="text-align:center">סיימתי ✓ · <span id="okn">${n}</span> חזרות</button></div></div>`;

     ${half?'<button class="big prim" id="xsave">סיים ושמור</button>':''}
     <button class="big sec" id="xstay">להמשיך להתאמן</button><button class="btn" id="xout">לצאת בלי לשמור</button>`);

    $('#xstay').onclick=closeSheet;$('#xout').onclick=()=>{closeSheet();endWO()};
  };
}
function endWO(){clearT();WO=null;$('#wo').classList.remove('show');$('#wo').innerHTML='';document.body.style.overflow='';try{wake&&wake.release()}catch(e){}render()}
function finish(){
  clearT();
  if(WO.mode==='free'){const t=WO.steps[0];endWO();confetti();toast(`🎉 ${t.name}: ${fmt(t.s)} — כל הכבוד!`);return}
  const ups=[];
  for(const id in WO.res){
    const e=EX[id],l=L(id),r=WO.res[id];
    if(WO.mode!=='full'||r.length<WO.rounds)continue;
    const good=e.type==='time'?r.every(x=>x===1):r.every(x=>x>=l.r[1]);
    if(!good){S.ok[id]=0;continue}
    S.ok[id]=(S.ok[id]||0)+1;
    if(S.ok[id]>=(e.type==='time'?2:1)){
      const cur=lv(id);
      if(cur<e.levels.length-1){
        if(e.levels[cur+1].bar&&!S.settings.bar)ups.push({id,blocked:1});
        else{S.levels[id]=cur+1;S.ok[id]=0;ups.push({id})}
      }
    }
  }
  const real=ups.filter(u=>!u.blocked);

  if(weekCount(weekStart(new Date()))>=S.settings.target&&!S.weekBonus[wk]){S.weekBonus[wk]=1;xp+=75;parts.push('יעד שבועי +75')}

    <div class="xpgain" id="xpg" dir="ltr">+0 XP</div><div class="small mut">${parts.join(' · ')}</div>
    ${lvUp?`<div class="lvup" style="text-align:right">${lvlLine()}</div>`:''}
    ${ups.map(u=>u.blocked?`<div class="lvup" style="text-align:right">💪 <b>${EX[u.id].name}</b>: אתה מוכן לשלב הבא, אבל הוא דורש מוט מתח. אפשר לסמן בהגדרות כשיהיה לך.</div>`
      :`<div class="lvup" style="text-align:right">⬆ <b>עלית שלב ב${EX[u.id].name}!</b><div class="small mut">מהאימון הבא: ${L(u.id).n} · ${tgt(u.id)}</div></div>`).join('')}
    ${badges.map(b=>`<div class="lvup" style="text-align:right">${badgeLine(b)}</div>`).join('')}
    <div class="card" style="text-align:right"><div class="row" style="margin-bottom:6px"><span style="font-size:24px">${r[0]}</span><b class="sp">${r[1]} · רמה ${lvlOf(S.xp)}</b></div>
      <div class="xpbar"><i style="width:${(S.xp%XPL)/XPL*100}%"></i></div>
      <div style="margin-top:10px">${Object.keys(WO.res).map(id=>`<div class="row" style="padding:4px 0"><span class="sp">${EX[id].name}</span><span class="mut">${EX[id].type==='time'?WO.res[id].map(x=>x?'✓':'✗').join(' '):WO.res[id].join(' · ')}</span></div>`).join('')}</div></div>
    <div class="wact">${walked||S.walkRun?'':'<button class="big sec" id="wk" style="text-align:center">🐕 יוצא עם הכלבים — הפעל טיימר הליכה</button>'}
    <button class="big prim" id="fin" style="text-align:center">סגור</button></div></div>`;
  confetti();beep(880,120);setTimeout(()=>beep(1175,200),150);buzz([80,40,80,40,160]);
  let c=0;const step=Math.max(1,Math.round(xp/30)),iv=setInterval(()=>{c=Math.min(xp,c+step);const el=$('#xpg');if(el)el.textContent='+'+c+' XP';if(c>=xp)clearInterval(iv)},30);
  const wkb=$('#wk');if(wkb)wkb.onclick=()=>{endWO();startWalk()};
  $('#fin').onclick=endWO;
}

const SLIDES=[
 ['🏋️','ברוך הבא!','תוכנית קליסטניקס של 15 דקות, 3 פעמים בשבוע, בלי ציוד. בנויה בדיוק לערבים עמוסים.'],
 ['🔋','כל ערב — בחירה אחת','פותחים את האפליקציה ובוחרים: אימון מלא (14 דק׳) או גרסה קצרה (6 דק׳) לימים שאתה גמור. שניהם נחשבים.'],
 ['🎯','באימון רק עוקבים','הדמות מראה את התנועה. בתרגילי חזרות מסמנים כמה הצלחת. בתרגילי זמן ובמנוחות הטיימר רץ לבד ומצפצף.'],
 ['⬆️','האפליקציה מתקדמת איתך','כשאתה עומד ביעד בכל הסבבים, התרגיל עולה שלב לבד. בדרך אוספים XP, דרגות ותגים.'],
 ['🐕','גם הכלבים בתוכנית','30 דקות הליכה נמרצת ביום. מפעילים טיימר הליכה, והאפליקציה מעריכה כמה ק״מ הלכת. אפשר לתקן למספר המדויק מ־Google Fit.']];
function intro(i){
  if(!S.seenIntro){S.seenIntro=1;save()}
  const sl=SLIDES[i],last=i===SLIDES.length-1;
  sheet(`<div class="slide"><div class="ic">${sl[0]}</div><h2 style="font-size:22px;margin:8px 0 0">${sl[1]}</h2><p>${sl[2]}</p></div>
    <div class="dots">${SLIDES.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
    <div class="hbtns">${i?'<button class="big sec" id="ib">→ חזור</button>':''}<button class="big prim" id="in">${last?'בוא נתחיל 💪':'הבא ←'}</button></div>
    ${last?'':'<button class="btn" id="isk">דלג</button>'}`);
  $('#in').onclick=()=>last?closeSheet():intro(i+1);
  const b=$('#ib');if(b)b.onclick=()=>intro(i-1);
  const k=$('#isk');if(k)k.onclick=closeSheet;
}
render();
if(!S.seenIntro&&!S.sessions.length)intro(0);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
